spring.application.name=digest-service
server.port=8083

spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

spring.flyway.default-schema=digests
spring.jpa.properties.hibernate.default_schema=digests

spring.ai.openai.base-url=http://localhost:8084
spring.ai.openai.api-key=not-needed
spring.ai.openai.timeout=20m
spring.ai.openai.max-retries=0
spring.ai.openai.chat.model=qwen2.5-3b-instruct
spring.ai.openai.chat.temperature=0.2