# Keep the original scheme when a proxy in front (the Funnel) already set it
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

log_format json escape=json '{'
    '"message":"$request_method $request_uri $status",'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json;

    # Docker's internal DNS: look the services up again when they're recreated
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/search {
        set $search http://search-service:8082;
        proxy_pass $search;
    }

    location /api/activity {
        set $search http://search-service:8082;
        proxy_pass $search;
    }

    location /api/digests {
        set $digest http://digest-service:8083;
        proxy_pass $digest;
    }

    location /api/ {
        set $articles http://article-store:8081;
        proxy_pass $articles;
    }

    location /swagger-ui/ {
        set $articles http://article-store:8081;
        proxy_pass $articles;
    }

    location /v3/api-docs {
        set $articles http://article-store:8081;
        proxy_pass $articles;
    }

    # Build files have content hashes in their names, so they never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the app. index.html must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
