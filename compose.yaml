x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: 
          memory: 1G

  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.3.4
    profiles: ["apps"]
    user: root
    command: ["--strict.perms=false"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeatdata:/usr/share/filebeat/data
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.4
    profiles: ["apps"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    deploy:
      resources:
        limits:
          memory: 2000M
    depends_on:
      elasticsearch:
        condition: service_healthy

  news-ingestor:
    build: ./news-ingestor
    profiles: ["apps"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      CURRENTS_API_KEY: ${CURRENTS_API_KEY}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY}
      FREE_NEWS_API_KEY: ${FREE_NEWS_API_KEY}
      NEWS_INGESTION_INTERVAL: PT5M
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
  
  search-service:
    build: ./search-service
    profiles: ["apps"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_BACKFILL_ARTICLE_STORE_URL: http://article-store:8081
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      article-store:
        condition: service_started

  article-store:
    build: ./article-store
    profiles: ["apps"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/news
      SPRING_DATASOURCE_USERNAME: news
      SPRING_DATASOURCE_PASSWORD: news
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build: ./happy-tree-news
    profiles: ["apps"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8090:80"
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      article-store:
        condition: service_started
      search-service:
        condition: service_started

volumes:
  pgdata:
  esdata:
  filebeatdata:
