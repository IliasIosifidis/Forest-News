apiVersion: v1
kind: ConfigMap
metadata:
  name: news-ingestor-config
data:
  SPRING_DOCKER_COMPOSE_ENABLED: "false"
  SPRING_RABBITMQ_HOST: rabbitmq
  NEWS_INGESTION_INTERVAL: PT30M          # 30 min in the lab, to spare the free API quotas
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-ingestor
spec:
  replicas: 1                              # must stay 1: the dedup cache is in memory
  selector:
    matchLabels:
      app: news-ingestor
  template:
    metadata:
      labels:
        app: news-ingestor
    spec:
      containers:
        - name: news-ingestor
          image: ghcr.io/iliasiosifidis/news-ingestor:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: news-ingestor-config
            - secretRef:
                name: news-api-keys        # the key names already match what the app expects
          env:
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_USER }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_DEFAULT_PASS }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5